<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — Ламповый календарь</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><link rel="stylesheet" href="/static/css/fonts.css"><link rel="stylesheet" href="/static/css/app.css"></head>
<body>
<main class="auth">
  <h1>Ламповый календарь</h1>
  <p class="sub dim">Расписание из Яндекс Календаря на маленьком мониторе</p>
  <p class="hint" style="margin:-8px 0 14px">Логин и пароль <b>этого приложения</b> (не от Яндекса). Первый раз здесь? Сначала зарегистрируйтесь.</p>
  <form class="card" id="f" autocomplete="on">
    <label for="login">Логин</label>
    <input type="text" id="login" name="username" autocomplete="username" required autofocus>
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" id="go">Войти</button>
    <div class="msg err" id="msg" role="alert"></div>
    <div class="alt" id="alt" hidden>Нет аккаунта? <a href="/register">Зарегистрироваться</a></div>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
fetch('/api/config').then(r => r.json()).then(c => { $('alt').hidden = !c.registration; });
$('f').addEventListener('submit', async e => {
  e.preventDefault(); $('go').disabled = true; $('msg').textContent = '';
  try {
    const r = await fetch('/api/login', {method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({login: $('login').value, password: $('password').value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || 'Ошибка ' + r.status);
    location.href = '/settings';
  } catch (err) { $('msg').textContent = err.message; $('go').disabled = false; }
});
</script>
</body></html>
